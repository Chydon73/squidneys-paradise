<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Squidney's Paradise</title>
<link rel="icon" href="icon.png" />
<style>
  html, body { margin: 0; height: 100%; background: #F1ECDF; }
  #boot { font: 13px 'Segoe UI', sans-serif; color: #5B6472; padding: 60px 16px; text-align: center; }
  #boot.err { color: #A63E28; white-space: pre-wrap; text-align: left; }
</style>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">Loading your league...</div></div>
<script>
// app.jsx is compiled to plain JavaScript the first time it runs (or after it changes),
// and the launcher caches the result so later starts skip the compiler.
(async function boot() {
  function hash(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(16);
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = () => reject(new Error('Could not load ' + src));
      document.head.appendChild(el);
    });
  }
  try {
    const source = await fetch('app.jsx', { cache: 'no-store' }).then((r) => r.text());
    const key = hash(source);
    let code = null;
    const cached = await fetch('/api/compiled?key=' + key, { cache: 'no-store' });
    if (cached.ok) {
      code = await cached.text();
    } else {
      await loadScript('vendor/babel.min.js');
      code = Babel.transform(source, { presets: ['react'], filename: 'app.jsx' }).code;
      fetch('/api/compiled?key=' + key, { method: 'POST', body: code }).catch(() => {});
    }
    const el = document.createElement('script');
    el.textContent = code + '\n//# sourceURL=app.js';
    document.body.appendChild(el);
  } catch (e) {
    const boot = document.getElementById('boot');
    boot.className = 'err';
    boot.textContent = 'The tracker failed to start:\n\n' + (e && e.stack || e);
  }
})();
</script>
</body>
</html>
